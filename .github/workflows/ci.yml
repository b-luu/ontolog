name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install validator dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check documentation
        run: python tools/check_docs.py
      - name: Validate template and example
        run: |
          python skills/ontolog-interview/assets/knowledge-repository/tools/validate.py skills/ontolog-interview/assets/knowledge-repository
          python skills/ontolog-interview/assets/knowledge-repository/tools/validate.py skills/ontolog-interview/assets/knowledge-repository/examples/subscription-business
      - name: Exercise CLI packaging
        run: |
          python ontolog.py --help
          python ontolog.py eject "$RUNNER_TEMP/company-knowledge"
          python "$RUNNER_TEMP/company-knowledge/tools/validate.py" "$RUNNER_TEMP/company-knowledge"
          python ontolog.py export-skill "$RUNNER_TEMP/ontolog-interview.zip"
          python -m zipfile -t "$RUNNER_TEMP/ontolog-interview.zip"
