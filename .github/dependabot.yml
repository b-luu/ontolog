version: 2
updates:
  - package-ecosystem: pip
    directory: /skills/ontolog-interview/assets/knowledge-repository
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
